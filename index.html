<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>비행기 슈팅 게임</title>
<style>
:root{--bg:#0b1020;--fg:#fff;--accent:#39ff88;--pink:#ff4fa3;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:center}
#wrap{position:relative;height:100%;max-height:100%;aspect-ratio:9/16;max-width:100%;touch-action:none}
canvas{width:100%;height:100%;display:block;background:#050816;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,8,22,.84);text-align:center;padding:24px}
#ov h1{margin:0;font-size:34px;color:var(--accent);line-height:1.25}
#ov p{margin:0;font-size:19px;line-height:1.55}
#b{color:#ffd54a}
#btn{font-size:26px;font-weight:700;padding:18px 44px;border:0;border-radius:18px;background:var(--pink);color:#fff;min-width:200px}
#btn:active{transform:scale(.96)}
.hide{display:none!important}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="360" height="640"></canvas>
<div id="ov">
<h1 id="t">비행기<br>슈팅 게임</h1>
<p id="m">손가락으로 전투기를 움직이세요.<br>미사일은 자동 발사!<br>폭탄을 부수고 오래 살아남으세요.<br>⭐ 5초 무적 ❤️ 목숨 ⚡ 5발 발사<br>💎 동료 전투기<br>🔴 빨간 아군 전투기는 쏘지 마세요!</p>
<p id="b"></p>
<button id="btn">시작</button>
</div>
</div>
<script>
const W=360,H=640,cv=document.getElementById('c'),g=cv.getContext('2d');
const ov=document.getElementById('ov'),btn=document.getElementById('btn'),bEl=document.getElementById('b');
let best=0,bestT=0;
try{best=+localStorage.getItem('shoot_best')||0;bestT=+localStorage.getItem('shoot_best_t')||0}catch(e){}
function showBest(){bEl.textContent=best?('최고 점수 '+best+' · 최고 생존 '+bestT.toFixed(1)+'초'):''}
showBest();
let st='ready',P,bul,en,fx,ex,bon,score,lives,tm,fireT,spawnT,inv,pw,bigT,bonT,allyT,sh,wm,toast,toastT,shake,dead,t0,tx=W/2,ty=H-120,stars=[];
for(let i=0;i<50;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:20+Math.random()*60,r:Math.random()*1.5+.5});
function reset(){P={x:W/2,y:H-120};tx=P.x;ty=P.y;bul=[];en=[];fx=[];ex=[];bon=[];score=0;lives=3;tm=0;fireT=0;spawnT=0.5;inv=0;pw=0;bigT=12;bonT=8;allyT=9;sh=0;wm=0;toast='';toastT=0;shake=0;dead=0}
function start(){reset();st='play';ov.classList.add('hide');t0=performance.now();requestAnimationFrame(loop)}
function over(){
st='over';
if(score>best){best=score}
if(tm>bestT){bestT=tm}
try{localStorage.setItem('shoot_best',best);localStorage.setItem('shoot_best_t',bestT)}catch(e){}
document.getElementById('t').innerHTML='게임 오버';
document.getElementById('m').innerHTML='생존 '+tm.toFixed(1)+'초<br>점수 '+score;
showBest();btn.textContent='다시 하기';ov.classList.remove('hide');
}
btn.addEventListener('click',start);
function pt(e){const r=cv.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*W;ty=(e.clientY-r.top)/r.height*H-60;tx=Math.max(24,Math.min(W-24,tx));ty=Math.max(60,Math.min(H-30,ty))}
cv.addEventListener('pointerdown',e=>{pt(e);cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',pt);
function say(s){toast=s;toastT=1.6}
function blast(x,y,R,big){
ex.push({x,y,t:0,R});
const n=big?34:16,cs=['#ffd54a','#ff8a1f','#ff4a1f','#444'];
for(let i=0;i<n;i++){const a=Math.random()*6.283,s=50+Math.random()*(big?220:150);fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+Math.random()*.5,c:cs[i%4],z:2+Math.random()*4})}
shake=Math.max(shake,big?.5:.22);
}
function hurt(n){
lives-=n;inv=1.5;blast(P.x,P.y,75,0);
if(lives<=0){lives=0;dead=1.0}
}
function upd(dt){
fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt});fx=fx.filter(f=>f.l>0);
ex.forEach(e=>e.t+=dt);ex=ex.filter(e=>e.t<.6);
stars.forEach(s=>{s.y+=s.s*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}});
shake=Math.max(0,shake-dt);toastT-=dt;
en.forEach(e=>{if(e.hit>0)e.hit-=dt});
}
function loop(now){
if(st!=='play')return;
const dt=Math.min(.05,(now-t0)/1000);t0=now;
if(dead>0){dead-=dt;en.forEach(e=>e.y+=e.v*dt);upd(dt);draw();if(dead<=0){over();return}requestAnimationFrame(loop);return}
tm+=dt;
const lv=Math.floor(score/100);
P.x+=(tx-P.x)*Math.min(1,dt*14);P.y+=(ty-P.y)*Math.min(1,dt*14);
if(inv>0)inv-=dt;
if(pw>0)pw=Math.max(0,pw-dt);
if(sh>0)sh=Math.max(0,sh-dt);
if(wm>0)wm=Math.max(0,wm-dt);
fireT-=dt;
if(fireT<=0){fireT=.28;bul.push({x:P.x,y:P.y-26,vx:0});if(pw>0){bul.push({x:P.x-10,y:P.y-18,vx:-90});bul.push({x:P.x+10,y:P.y-18,vx:90});bul.push({x:P.x-18,y:P.y-8,vx:-170});bul.push({x:P.x+18,y:P.y-8,vx:170})}
if(wm>0){for(const dx of [-42,-68,42,68]){const dy=Math.abs(dx)>50?26:12;for(const v of [-80,-27,27,80])bul.push({x:P.x+dx,y:P.y+dy-14,vx:v})}}}
bul.forEach(b=>{b.y-=520*dt;b.x+=b.vx*dt});bul=bul.filter(b=>b.y>-20);
spawnT-=dt;
if(spawnT<=0){spawnT=Math.max(.38,1.0-lv*.06);en.push({x:24+Math.random()*(W-48),y:-24,v:90+lv*12+Math.random()*40,r:18,hp:1})}
bigT-=dt;
if(bigT<=0){bigT=14+Math.random()*6;en.push({x:70+Math.random()*(W-140),y:-50,v:50,r:42,hp:10,big:1});say('⚠ 큰 폭탄 접근!')}
allyT-=dt;
if(allyT<=0){allyT=8+Math.random()*6;en.push({x:30+Math.random()*(W-60),y:-30,v:100,r:22,hp:1,ally:1})}
bonT-=dt;
if(bonT<=0){bonT=9+Math.random()*5;const k=['star','power','heart','gem'][Math.floor(Math.random()*4)];bon.push({x:30+Math.random()*(W-60),y:-20,k:(k==='heart'&&lives>=5)?'star':k,v:110})}
en.forEach(e=>e.y+=e.v*dt);
bon.forEach(b=>b.y+=b.v*dt);
for(const e of en){
for(const b of bul){
if(!e.d&&b.y>-90&&Math.abs(b.x-e.x)<e.r+3&&Math.abs(b.y-e.y)<e.r+4){
b.y=-99;e.hp--;e.hit=.08;
if(e.ally){e.d=1;blast(e.x,e.y,60,0);lives--;say('아군을 맞혔어요! ♥ -1');if(lives<=0){lives=0;dead=1.0}}
else if(e.hp<=0){e.d=1;score+=e.big?50:10;blast(e.x,e.y,e.big?110:42,e.big)}
}
}
if(!e.d&&!e.ally&&(inv<=0||sh>0)&&dead<=0&&Math.hypot(P.x-e.x,P.y-e.y)<e.r+14){e.d=1;blast(e.x,e.y,e.big?120:55,e.big);if(sh>0)score+=e.big?50:10;else hurt(e.big?2:1)}
}
for(const b of bon){
if(Math.hypot(P.x-b.x,P.y-b.y)<32){
b.d=1;
if(b.k==='star'){sh=5;say('⭐ 5초 무적!')}
else if(b.k==='heart'){lives=Math.min(5,lives+1);say('❤️ 목숨 +1')}
else if(b.k==='gem'){wm=5;say('💎 동료 전투기 출동!')}
else{pw=8;say('⚡ 총알 5발 발사!')}
}
}
en=en.filter(e=>!e.d&&e.y<H+60);
bon=bon.filter(b=>!b.d&&b.y<H+40);
upd(dt);
draw();requestAnimationFrame(loop);
}
function bomb(e){
const r=e.r;g.save();g.translate(e.x,e.y);
g.fillStyle=e.hit>0?'#777':'#0d0d0d';
g.beginPath();g.arc(0,0,r,0,6.283);g.fill();
g.lineWidth=e.big?4:2;g.strokeStyle=e.big?'#ff4040':'#6a6a6a';g.stroke();
g.fillStyle='rgba(255,255,255,.22)';g.beginPath();g.arc(-r*.35,-r*.35,r*.24,0,6.283);g.fill();
g.fillStyle='#555';g.fillRect(-r*.22,-r*1.15,r*.44,r*.3);
g.strokeStyle='#c9a15a';g.lineWidth=3;g.beginPath();g.moveTo(0,-r*1.15);g.quadraticCurveTo(r*.3,-r*1.5,r*.55,-r*1.35);g.stroke();
g.fillStyle=Math.random()<.5?'#ffd54a':'#ff6a1f';g.beginPath();g.arc(r*.55,-r*1.35,r*.14+2,0,6.283);g.fill();
g.restore();
}
function jet(x,y,c1,c2,fl,sc){
g.save();g.translate(x,y);if(sc)g.scale(sc,sc);if(fl)g.scale(1,-1);
const f=6+Math.random()*8;
g.fillStyle='#ffb347';g.beginPath();g.moveTo(-5,24);g.lineTo(0,26+f);g.lineTo(5,24);g.closePath();g.fill();
g.fillStyle=c1||'#2d7bff';g.strokeStyle=c2||'#a8d4ff';g.lineWidth=1.5;
g.beginPath();
const p=[[0,-28],[5,-10],[26,12],[26,19],[7,13],[5,21],[11,27],[-11,27],[-5,21],[-7,13],[-26,19],[-26,12],[-5,-10]];
g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);
g.closePath();g.fill();g.stroke();
g.fillStyle='#bfe6ff';g.beginPath();g.ellipse(0,-8,3.5,8,0,0,6.283);g.fill();
g.restore();
}
function draw(){
g.clearRect(0,0,W,H);
g.save();
if(shake>0)g.translate((Math.random()-.5)*shake*24,(Math.random()-.5)*shake*24);
g.fillStyle='#fff';stars.forEach(s=>{g.globalAlpha=.6;g.fillRect(s.x,s.y,s.r,s.r)});g.globalAlpha=1;
g.fillStyle='#39ff88';bul.forEach(b=>g.fillRect(b.x-2,b.y-10,4,14));
en.forEach(e=>e.ally?jet(e.x,e.y,'#e53935','#ffb3b0',1):bomb(e));
g.font='28px sans-serif';g.textAlign='center';g.textBaseline='middle';
bon.forEach(b=>{
g.fillStyle='rgba(255,255,255,.18)';g.beginPath();g.arc(b.x,b.y,22,0,6.283);g.fill();
g.fillStyle='#fff';g.fillText(b.k==='star'?'⭐':b.k==='heart'?'❤️':b.k==='gem'?'💎':'⚡',b.x,b.y+1);
});
g.textBaseline='alphabetic';
if(dead<=0&&!(inv>0&&Math.floor(inv*10)%2))jet(P.x,P.y);
if(sh>0&&dead<=0&&(sh>1.2||Math.floor(sh*8)%2)){g.strokeStyle='rgba(255,230,80,.9)';g.lineWidth=3;g.beginPath();g.arc(P.x,P.y,36,0,6.283);g.stroke();g.fillStyle='rgba(255,230,80,.15)';g.fill()}
if(wm>0&&dead<=0&&(wm>1.2||Math.floor(wm*8)%2))for(const dx of [-42,-68,42,68])jet(P.x+dx,P.y+(Math.abs(dx)>50?26:12),'#5fd0ff','#e6f7ff',0,.45);
ex.forEach(e=>{
const p=e.t/.6,R=e.R*(.35+.65*p);
const gr=g.createRadialGradient(e.x,e.y,0,e.x,e.y,R);
gr.addColorStop(0,'rgba(255,250,200,'+(1-p)+')');
gr.addColorStop(.45,'rgba(255,140,30,'+(.9*(1-p))+')');
gr.addColorStop(1,'rgba(255,60,0,0)');
g.fillStyle=gr;g.beginPath();g.arc(e.x,e.y,R,0,6.283);g.fill();
g.strokeStyle='rgba(255,200,100,'+(1-p)+')';g.lineWidth=3;g.beginPath();g.arc(e.x,e.y,e.R*p*1.1,0,6.283);g.stroke();
});
fx.forEach(f=>{g.globalAlpha=Math.max(0,Math.min(1,f.l*2));g.fillStyle=f.c;g.fillRect(f.x,f.y,f.z,f.z)});g.globalAlpha=1;
g.restore();
g.fillStyle='#fff';g.font='bold 19px sans-serif';
g.textAlign='left';g.fillText('점수 '+score,12,28);
g.textAlign='center';g.fillStyle='#ffd54a';g.fillText('⏱ '+tm.toFixed(1)+'초',W/2+6,28);
g.textAlign='right';g.fillStyle='#ff5b7a';g.fillText('♥'.repeat(Math.max(0,lives)),W-12,28);
if(pw>0){g.textAlign='left';g.fillStyle='#ffd54a';g.font='bold 15px sans-serif';g.fillText('⚡ '+pw.toFixed(1)+'초',12,50)}
if(wm>0){g.textAlign='right';g.fillStyle='#7fe3ff';g.font='bold 15px sans-serif';g.fillText('💎 동료 '+wm.toFixed(1)+'초',W-12,50)}
if(sh>0){g.textAlign='left';g.fillStyle='#ffe650';g.font='bold 15px sans-serif';g.fillText('⭐ 무적 '+sh.toFixed(1)+'초',12,pw>0?70:50)}
if(toastT>0){g.textAlign='center';g.fillStyle='rgba(255,255,255,'+Math.min(1,toastT*2)+')';g.font='bold 22px sans-serif';g.fillText(toast,W/2,100)}
}
reset();draw();
</script>
</body>
</html>
